# One site in containers, with a Forgejo of its own (ADR 0002): what a site
# repository includes, on a laptop and on one's own server alike. `docker compose
# up --wait` in the site repository brings it up and returns when its hosts answer.
#
# Every service runs with no capabilities, a read-only file system and limits
# (ADR 0005), and only the web server has ports. compose/README.md lists what each
# volume holds.

name: ${KONZILO_SITE}

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:noexec,nosuid,size=256m"]
  pids_limit: 512

x-forgejo: &forgejo
  <<: *hardened
  image: codeberg.org/forgejo/forgejo:${FORGEJO}-rootless@sha256:${FORGEJO_DIGEST}
  mem_limit: 1g
  volumes:
    - forgejo-data:/var/lib/gitea
    - forgejo-config:/etc/gitea
    - ${KONZILO_CORE}/compose/forgejo/templates:/konzilo/templates:ro
    - ${KONZILO_CORE}/compose/forgejo/init.sh:/konzilo/init.sh:ro
  environment:
    FORGEJO__server__ROOT_URL: http://localhost:${KONZILO_PORT_GIT}/
    FORGEJO__server__HTTP_PORT: "3000"
    FORGEJO__server__DISABLE_SSH: "true"
    FORGEJO__server__START_SSH_SERVER: "false"
    FORGEJO__server__LFS_START_SERVER: "true"
    FORGEJO__database__DB_TYPE: sqlite3
    FORGEJO__security__INSTALL_LOCK: "true"
    FORGEJO__security__GLOBAL_TWO_FACTOR_REQUIREMENT: all
    FORGEJO__security__LOGIN_REMEMBER_DAYS: "0"
    # Cookies are shared across ports on localhost, so each site names its own.
    FORGEJO__security__COOKIE_REMEMBER_NAME: ${KONZILO_SITE}_remember
    FORGEJO__security__CSRF_COOKIE_NAME: ${KONZILO_SITE}_csrf
    FORGEJO__session__COOKIE_NAME: ${KONZILO_SITE}_session
    # WebKit and Safari refuse a Secure cookie on http://localhost (ADR 0002).
    FORGEJO__session__COOKIE_SECURE: "false"
    FORGEJO__service__DISABLE_REGISTRATION: "true"
    FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
    FORGEJO__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
    FORGEJO__service.explore__DISABLE_USERS_PAGE: "true"
    FORGEJO__repository__DEFAULT_PRIVATE: private
    FORGEJO__cors__ENABLED: "true"
    FORGEJO__cors__ALLOW_DOMAIN: http://localhost:${KONZILO_PORT_ADMIN}
    FORGEJO__cors__METHODS: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
    FORGEJO__cors__HEADERS: Content-Type,User-Agent,Authorization,Accept
    FORGEJO__log__LEVEL: Warn
    FORGEJO__metrics__ENABLED: "false"
    FORGEJO__packages__ENABLED: "false"
    FORGEJO__actions__ENABLED: "false"
    # The one address a webhook may reach: the service, which starts a build.
    FORGEJO__webhook__ALLOWED_HOST_LIST: editors

services:
  # Makes the database and the instance's administrator before Forgejo first starts.
  forgejo-init:
    <<: *forgejo
    command: ["sh", "/konzilo/init.sh"]
    restart: "no"
    secrets: [instance-password]

  forgejo:
    <<: *forgejo
    depends_on:
      forgejo-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 2s
      timeout: 3s
      retries: 60

  # The only one with ports. Each host is its own port, which is the same inside the
  # container, so that a container sharing this network can reach Forgejo under the
  # address its answers name (ADR 0005).
  web:
    <<: *hardened
    build:
      context: ${KONZILO_CORE}
      dockerfile: compose/web/Dockerfile
      args:
        NODE: ${NODE_RELEASE}
        NODE_DIGEST: ${NODE_DIGEST}
        CADDY: ${CADDY}
        CADDY_DIGEST: ${CADDY_DIGEST}
    image: konzilo-web:${KONZILO_SITE}
    # The site's own network; search's, where it alone, and what shares its network, reaches
    # Typesense; and the visitors' service's, which it alone reaches.
    networks: [default, search, visitors]
    # Takes a new release's headers and redirects, and the route to search, by itself, since
    # nothing else may reach it.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]
    depends_on:
      forgejo: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - 127.0.0.1:${KONZILO_PORT_SITE}:${KONZILO_PORT_SITE}
      - 127.0.0.1:${KONZILO_PORT_ADMIN}:${KONZILO_PORT_ADMIN}
      - 127.0.0.1:${KONZILO_PORT_GIT}:${KONZILO_PORT_GIT}
      - 127.0.0.1:${KONZILO_PORT_PREVIEW}:${KONZILO_PORT_PREVIEW}
    environment:
      KONZILO_PORT_SITE: ${KONZILO_PORT_SITE}
      KONZILO_PORT_ADMIN: ${KONZILO_PORT_ADMIN}
      KONZILO_PORT_GIT: ${KONZILO_PORT_GIT}
      KONZILO_PORT_PREVIEW: ${KONZILO_PORT_PREVIEW}
      KONZILO_REPOSITORY: ${KONZILO_SITE}/source
      KONZILO_FORGEJO_ORIGIN: http://localhost:${KONZILO_PORT_GIT}
      KONZILO_PREVIEW_ORIGIN: http://localhost:${KONZILO_PORT_PREVIEW}
    volumes:
      - site-public:/srv/site:ro
      - admin-config:/srv/admin-config:ro
      - search-route:/srv/search:ro
      - caddy-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:${KONZILO_PORT_ADMIN}/ &&
          wget -q -O /dev/null http://127.0.0.1:${KONZILO_PORT_GIT}/api/healthz
      interval: 2s
      timeout: 3s
      retries: 60

  # Fills Forgejo the first time: an organisation, a repository with the demo content
  # as source files, the site repository's own in its demo-content/ where it has any,
  # else the core's, an account and the editor's OAuth client; and at every start makes
  # sure of the machine accounts, the content repository, the webhook and the live
  # preview's OAuth client.
  seed:
    <<: *hardened
    build: &builder
      context: ${KONZILO_CORE}
      dockerfile: compose/builder/Dockerfile
      args:
        NODE: ${NODE_RELEASE}
        NODE_DIGEST: ${NODE_DIGEST}
    image: konzilo-builder:${KONZILO_SITE}
    depends_on:
      web: { condition: service_started }
    network_mode: service:web
    restart: "no"
    mem_limit: 512m
    command: ["node", "/konzilo/compose/seed/seed.js"]
    environment:
      KONZILO_SITE: ${KONZILO_SITE}
      KONZILO_ACCOUNT: ${KONZILO_ACCOUNT}
      KONZILO_FORGEJO_ORIGIN: http://localhost:${KONZILO_PORT_GIT}
      KONZILO_ADMIN_ORIGIN: http://localhost:${KONZILO_PORT_ADMIN}
      KONZILO_PREVIEW_ORIGIN: http://localhost:${KONZILO_PORT_PREVIEW}
    secrets: [instance-password, account-password]
    volumes:
      - state:/state
      - preview-secret:/preview-secret
      - builder-secret:/builder-secret
      - editors-secret:/editors-secret
      - typesense-secret:/typesense-secret
      - ${KONZILO_SITE_DIR:-.}:/site:ro

  # Search (ADR 0053): Typesense, the vendor's, in a network of its own that only the web server
  # shares (ADR 0005), with no port and no way out. Its admin key is in the configuration the seed
  # writes, and its index is made by every build, from what is published alone.
  typesense:
    <<: *hardened
    build:
      context: ${KONZILO_CORE}
      dockerfile: compose/typesense/Dockerfile
      args:
        TYPESENSE: ${TYPESENSE}
        TYPESENSE_DIGEST: ${TYPESENSE_DIGEST}
    image: konzilo-typesense:${KONZILO_SITE}
    depends_on:
      seed: { condition: service_completed_successfully }
    networks: [search]
    restart: unless-stopped
    mem_limit: 512m
    # A single node, whose address may change at each start.
    command: ["--data-dir", "/data", "--config", "/secret/typesense.ini", "--api-port", "8108", "--reset-peers-on-error"]
    volumes:
      - typesense-data:/data
      - typesense-secret:/secret:ro
    healthcheck:
      # The vendor's image has neither curl nor wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Publishes (ADR 0031): prepares the site's code once, writes the editor's configuration,
  # and then sleeps and builds when asked, one build at a time. What runs on demand starts
  # itself, so that `up` is all a machine needs and no container gets Docker's socket
  # (ADR 0002). If its first build makes no site it stops, and `up --wait` says so at once.
  # It shares the web server's network, so that it reaches Forgejo under the address an LFS
  # answer names, and has no port of its own: it hears of a build through a file.
  builder:
    <<: *hardened
    build: *builder
    image: konzilo-builder:${KONZILO_SITE}
    init: true
    depends_on:
      seed: { condition: service_completed_successfully }
      # Its first build makes the search index.
      typesense: { condition: service_healthy }
    network_mode: service:web
    restart: "no"
    stop_grace_period: 1s
    mem_limit: 3g
    healthcheck:
      # In temporary space, which every start begins without.
      test: ["CMD", "test", "-f", "/tmp/built"]
      interval: 2s
      timeout: 3s
      retries: 300
    command: ["node", "/konzilo/bin/konzilo-builder.js"]
    environment:
      KONZILO_SITE: ${KONZILO_SITE}
      KONZILO_ORIGIN: http://localhost:${KONZILO_PORT_SITE}
      KONZILO_SITE_ORIGIN: http://localhost:${KONZILO_PORT_SITE}
      KONZILO_ADMIN_ORIGIN: http://localhost:${KONZILO_PORT_ADMIN}
      KONZILO_FORGEJO_ORIGIN: http://localhost:${KONZILO_PORT_GIT}
      KONZILO_PREVIEW_ORIGIN: http://localhost:${KONZILO_PORT_PREVIEW}
      KONZILO_REPOSITORY: ${KONZILO_SITE}/source
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - builder-secret:/secret:ro
      - build-control:/control
      - site-work:/work
      - site-public:/public
      - admin-config:/admin-config
      - search-route:/search-route
      - ${KONZILO_SITE_DIR:-.}:/site:ro
      - ${KONZILO_CORE}:${KONZILO_CORE}:ro

  # The service, in its role for editors (ADR 0044): Forgejo's webhook and the clock each ask
  # for a build, and the editor asks how publishing stands, and reads the forms' submissions from
  # the service's data, which the role for visitors keeps (ADR 0045), through the web server. It
  # mails each submission to its form's recipients through the adapter an Admin chooses on the
  # Mail page, off until then (ADR 0003): this local copy writes each mail to its log instead, and
  # sends none. It has a credential that can only read the source repository, and one that can
  # only read who is an Admin.
  editors:
    <<: *hardened
    build: *builder
    image: konzilo-builder:${KONZILO_SITE}
    init: true
    depends_on:
      seed: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 1s
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then((a) => process.exit(a.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    command: ["node", "/konzilo/bin/konzilo-service.js", "editors"]
    environment:
      KONZILO_REPOSITORY: ${KONZILO_SITE}/source
      KONZILO_MAIL_TO_LOG: "true"
    volumes:
      - editors-secret:/secret:ro
      - build-control:/control
      - thumbnails:/thumbnails
      - service-data:/service-data
      # The site's folder, for its site description: a mount of the file alone would hold on to the
      # file it was made with, and never show one replaced, as Git and an editor write one.
      - ${KONZILO_SITE_DIR:-.}:/site:ro

  # The service, in its role for visitors (ADR 0044): what visitors' browsers send below
  # /_konzilo/, which the web server passes on, such as a site's forms (ADR 0045), kept in the
  # service's data. It is in a network of its own, which only the web server shares, with no port
  # and no way out, and it reads the forms from the site description.
  visitors:
    <<: *hardened
    build: *builder
    image: konzilo-builder:${KONZILO_SITE}
    init: true
    networks: [visitors]
    restart: unless-stopped
    stop_grace_period: 1s
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/health').then((a) => process.exit(a.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    command: ["node", "/konzilo/bin/konzilo-service.js", "visitors"]
    environment:
      KONZILO_SITE_ORIGIN: http://localhost:${KONZILO_PORT_SITE}
    volumes:
      - service-data:/service-data
      # The site's folder, for its site description, as for the role for editors.
      - ${KONZILO_SITE_DIR:-.}:/site:ro

  # The live preview (ADR 0032): its gate stands from the first moment, and starts the dev
  # server when an editor opens an entry or someone visits it in a tab of its own, signed in
  # through Forgejo as its own OAuth client. It shares the web server's network, so that the
  # web server alone reaches it, and it reaches Forgejo as the seed does. It has a credential
  # that can only read, and a copy of the site's code of its own.
  preview:
    <<: *hardened
    build: *builder
    image: konzilo-builder:${KONZILO_SITE}
    init: true
    depends_on:
      seed: { condition: service_completed_successfully }
    network_mode: service:web
    restart: unless-stopped
    stop_grace_period: 2s
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/_konzilo/preview/health').then((a) => process.exit(a.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
    command: ["node", "/konzilo/bin/konzilo-preview.js"]
    environment:
      KONZILO_SITE: ${KONZILO_SITE}
      KONZILO_REPOSITORY: ${KONZILO_SITE}/source
      KONZILO_SITE_ORIGIN: http://localhost:${KONZILO_PORT_SITE}
      KONZILO_ADMIN_ORIGIN: http://localhost:${KONZILO_PORT_ADMIN}
      KONZILO_FORGEJO_ORIGIN: http://localhost:${KONZILO_PORT_GIT}
      KONZILO_PREVIEW_ORIGIN: http://localhost:${KONZILO_PORT_PREVIEW}
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - preview-work:/work
      - preview-secret:/secret:ro
      - ${KONZILO_SITE_DIR:-.}:/site:ro
      - ${KONZILO_CORE}:${KONZILO_CORE}:ro

  # `docker compose run --rm code` prints the seeded account's current code.
  code:
    <<: *hardened
    build: *builder
    image: konzilo-builder:${KONZILO_SITE}
    profiles: [tools]
    network_mode: none
    command: ["node", "/konzilo/bin/konzilo-code.js"]
    volumes:
      - state:/state:ro

# Files, since Compose can write no secret into a read-only container, and a secret
# is never in the environment (ADR 0005). A local copy's passwords are known.
secrets:
  instance-password:
    file: ${KONZILO_SECRETS:-./local-secrets}/instance-password
  account-password:
    file: ${KONZILO_SECRETS:-./local-secrets}/account-password

networks:
  default:
  # Typesense's own, with no way out: the web server, and what shares its network, reach it.
  search:
    internal: true
  # The visitors' service's own, with no way out: the web server alone reaches it.
  visitors:
    internal: true

volumes:
  forgejo-data:
  forgejo-config:
  caddy-data:
  state:
  site-work:
  site-public:
  admin-config:
  preview-work:
  preview-secret:
  builder-secret:
  editors-secret:
  build-control:
  thumbnails:
  typesense-data:
  typesense-secret:
  search-route:
  service-data:
